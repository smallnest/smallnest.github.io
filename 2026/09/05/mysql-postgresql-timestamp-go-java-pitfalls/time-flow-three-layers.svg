<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 300" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1010" height="300" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Box 1: 应用层 -->
  <rect x="30" y="107" width="215" height="86" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="30" y="117" width="4" height="66" rx="2" fill="#0EA5E9"/>
  <text x="137" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#0369A1">应用时间对象</text>
  <text x="137" y="171" text-anchor="middle" font-size="14" fill="#475569">时刻 + 时区标签</text>

  <!-- Arrow 1: 驱动 -->
  <text x="287" y="138" text-anchor="middle" font-size="13" fill="#475569">驱动</text>
  <line x1="245" y1="150" x2="325" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: 线路协议 -->
  <rect x="330" y="60" width="310" height="184" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="330" y="70" width="4" height="164" rx="2" fill="#94A3B8"/>
  <text x="485" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">线路协议</text>
  <line x1="348" y1="104" x2="622" y2="104" stroke="#E2E8F0" stroke-width="1"/>
  <text x="352" y="130" font-size="14" font-weight="600" fill="#00758F">MySQL：裸字段串</text>
  <text x="352" y="152" font-size="13" fill="#64748B">（无时区信息）</text>
  <text x="352" y="182" font-size="14" font-weight="600" fill="#336791">PG 二进制：</text>
  <text x="352" y="204" font-size="14" fill="#336791">timestamptz = 64 位微秒（绝对时刻）</text>
  <text x="352" y="226" font-size="14" fill="#336791">timestamp = 裸字段串</text>

  <!-- Arrow 2 -->
  <line x1="640" y1="150" x2="715" y2="150" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: 服务器/列 -->
  <rect x="720" y="60" width="260" height="184" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="720" y="70" width="4" height="164" rx="2" fill="#334155"/>
  <text x="850" y="92" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">服务器 / 列</text>
  <line x1="738" y1="104" x2="962" y2="104" stroke="#E2E8F0" stroke-width="1"/>
  <text x="742" y="160" font-size="14" fill="#334155"><tspan font-weight="600">DATETIME</tspan>：原样存</text>
  <text x="742" y="192" font-size="14" fill="#334155"><tspan font-weight="600">TIMESTAMP</tspan>：服务端转会话时区</text>
</svg>
